[package]
name = "immersive-map-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The ImmersiveMap engine for Android: the shared core's camera and tile coverage drawn with wgpu over Vulkan."

[lib]
# cdylib is the library the Android app loads, rlib the one the tests and a desktop host link.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The shared engine code (github.com/artembobkin/ImmersiveMapCore), pinned to a commit.
map-camera = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "45b6ad277b28c3d7009efb363659bb90087e2ecd" }
map-frame = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "45b6ad277b28c3d7009efb363659bb90087e2ecd" }
map-geo = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "45b6ad277b28c3d7009efb363659bb90087e2ecd" }
map-visibility = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "45b6ad277b28c3d7009efb363659bb90087e2ecd" }
wgpu = "30"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = "0.9"
raw-window-handle = "0.6"
android_logger = "0.15"
log = "0.4"
pollster = "0.4"

[dev-dependencies]
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
