[package]
name = "immersive-map-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The ImmersiveMap engine for Android: the shared core's camera and tile coverage drawn with wgpu over Vulkan."

[lib]
# cdylib is the library the Android app loads, rlib the one the tests and a desktop host link.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The shared engine code (github.com/artembobkin/ImmersiveMapCore), pinned to a commit.
map-camera = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "c20809d624c471f3d14a764e4938f76d7d9d4e73" }
map-frame = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "c20809d624c471f3d14a764e4938f76d7d9d4e73" }
map-geo = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "c20809d624c471f3d14a764e4938f76d7d9d4e73" }
map-visibility = { git = "https://github.com/artembobkin/ImmersiveMapCore", rev = "c20809d624c471f3d14a764e4938f76d7d9d4e73" }
wgpu = "30"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = "0.9"
raw-window-handle = "0.6"
android_logger = "0.15"
pollster = "0.4"

[dev-dependencies]
# The web shaders' check reads their stages with the naga wgpu builds them with.
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
